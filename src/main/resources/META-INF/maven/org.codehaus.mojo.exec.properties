# Custom configuration for exec-maven-plugin
# This will force the use of JavaFX modules when running the application

# Set the main class
mainClass=com.clinic.app.App

# Add JavaFX modules to the JVM arguments
jvmArguments=--module-path;${project.build.directory}/lib;--add-modules;javafx.controls,javafx.fxml,javafx.graphics,javafx.base

# Set the classpath
classpath=${project.build.outputDirectory};${project.build.directory}/lib/*

# Disable cleanup of daemon threads
cleanupDaemonThreads=false